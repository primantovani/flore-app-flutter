<h1>Gestão do Closet Circular</h1>

<div class="erro" *ngIf="erro">{{ erro }}</div>

<div class="carregando" *ngIf="carregando">Carregando peças...</div>

<table class="tabela" *ngIf="!carregando && pecas.length > 0">
  <thead>
    <tr>
      <th>Nome</th>
      <th>Categoria</th>
      <th>Tamanho</th>
      <th>Preço</th>
      <th>Status</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let peca of pecas">
      <td>{{ peca.nome }}</td>
      <td>{{ peca.categoria }}</td>
      <td>{{ peca.tamanho }}</td>
      <td>R$ {{ peca.preco }}</td>
      <td>{{ peca.vendida ? 'Vendida' : 'Disponível' }}</td>
      <td><button (click)="removerPeca(peca.id)">Remover</button></td>
    </tr>
  </tbody>
</table>

<p class="vazio" *ngIf="!carregando && !erro && pecas.length === 0">Nenhuma peça cadastrada ainda.</p>

<h2>Cadastrar nova peça</h2>
<form (ngSubmit)="cadastrarPeca()" class="form">
  <input type="text" placeholder="Nome" [(ngModel)]="novaPeca.nome" name="nome" required />
  <input type="text" placeholder="Categoria" [(ngModel)]="novaPeca.categoria" name="categoria" required />
  <input type="text" placeholder="Tamanho" [(ngModel)]="novaPeca.tamanho" name="tamanho" />
  <input type="number" placeholder="Preço" [(ngModel)]="novaPeca.preco" name="preco" />
  <button type="submit">Cadastrar</button>
</form>
